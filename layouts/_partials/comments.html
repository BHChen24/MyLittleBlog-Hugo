{{- /* Overrides PaperMod's empty comments partial with giscus. */ -}}
{{- /* Renders nothing until params.giscus.repo is set in hugo.yaml. */ -}}
{{- with site.Params.giscus }}
{{- if .repo }}
<div class="giscus"></div>
<script>
  (function () {
    // PaperMod sets <html data-theme> in <head> from the toggle or the OS, so
    // it is already final here. giscus's own preferred_color_scheme only
    // follows the OS and would ignore the toggle.
    const html = document.documentElement;
    const giscusTheme = () => html.dataset.theme === "dark" ? "dark" : "light";

    const s = document.createElement("script");
    s.src = "https://giscus.app/client.js";
    s.crossOrigin = "anonymous";
    s.async = true;
    Object.entries({
      repo: {{ .repo }},
      repoId: {{ .repoId }},
      category: {{ .category | default "Announcements" }},
      categoryId: {{ .categoryId }},
      mapping: "pathname",
      strict: "1",
      reactionsEnabled: "1",
      emitMetadata: "0",
      inputPosition: "bottom",
      theme: giscusTheme(),
      lang: {{ if eq $.Site.Language.Lang "zh" }}"zh-CN"{{ else }}"en"{{ end }},
      loading: "lazy",
    }).forEach(([k, v]) => { s.dataset[k] = v; });
    document.currentScript.after(s);

    // Retheme the iframe when the toggle flips data-theme. Watching the
    // attribute rather than the button keeps this independent of PaperMod's
    // footer script.
    new MutationObserver(() => {
      const frame = document.querySelector("iframe.giscus-frame");
      if (!frame) return;
      frame.contentWindow.postMessage(
        { giscus: { setConfig: { theme: giscusTheme() } } },
        "https://giscus.app"
      );
    }).observe(html, { attributes: true, attributeFilter: ["data-theme"] });
  })();
</script>
<noscript>Enable JavaScript to view comments.</noscript>
{{- end }}
{{- end }}
