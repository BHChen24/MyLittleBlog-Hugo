{{- /* Overrides PaperMod's empty comments partial with giscus. */ -}}
{{- /* Renders nothing until params.giscus.repo is set in hugo.yaml. */ -}}
{{- with site.Params.giscus }}
{{- if .repo }}
<script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ .repoId }}"
        data-category="{{ .category | default "Announcements" }}"
        data-category-id="{{ .categoryId }}"
        data-mapping="pathname"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="{{ if eq $.Site.Language.Lang "zh" }}zh-CN{{ else }}en{{ end }}"
        crossorigin="anonymous"
        async>
</script>
<noscript>Enable JavaScript to view comments.</noscript>
{{- end }}
{{- end }}
